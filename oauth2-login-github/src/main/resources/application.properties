spring.application.name=oauth2-login-github
server.port=8086

# Replace these placeholders with environment variables before manual GitHub login.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:demo-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:demo-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
